<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#802425"/>
      <stop offset="65%" stop-color="#4a1213"/>
      <stop offset="100%" stop-color="#1e0607"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda4"/>
      <stop offset="35%" stop-color="#d49a3d"/>
      <stop offset="70%" stop-color="#b8731d"/>
      <stop offset="100%" stop-color="#73420b"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Circle with Outer Gold Border -->
  <circle cx="64" cy="64" r="61" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#goldGlow)"/>
  
  <!-- Subtle Inner Concentric Ring with Decorative Dash -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-dasharray="3.5 2.5" opacity="0.85"/>
  <circle cx="64" cy="64" r="47" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- 8 Sacred Sun Points -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <line x1="64" y1="17" x2="64" y2="22"/>
    <line x1="64" y1="106" x2="64" y2="111"/>
    <line x1="17" y1="64" x2="22" y2="64"/>
    <line x1="106" y1="64" x2="111" y2="64"/>
    <line x1="31" y1="31" x2="35" y2="35"/>
    <line x1="93" y1="93" x2="97" y2="97"/>
    <line x1="31" y1="97" x2="35" y2="93"/>
    <line x1="93" y1="35" x2="97" y2="31"/>
  </g>

  <!-- Sacred Glyph: Devanagari 'प्रा' with golden polish -->
  <text x="64" y="80" 
        font-family="'Tiro Devanagari Hindi', 'Martel', 'Georgia', serif" 
        font-size="52" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        letter-spacing="1">प्रा</text>

  <!-- Bindu of Consciousness -->
  <circle cx="64" cy="38" r="2.8" fill="#fff4b8" stroke="#b8731d" stroke-width="0.6"/>
</svg>